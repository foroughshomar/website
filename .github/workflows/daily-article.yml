name: Daily article
on:
  schedule:
    - cron: '30 3 * * *'   # 07:00 Asia/Tehran
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-article
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node automation/publish.mjs
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      - run: |
          git config user.name "foroughshomar-bot"
          git config user.email "foroughshomar-bot@users.noreply.github.com"
          git add -A && git commit -m "Daily article $(date -u +%F)" && git push || echo "nothing to commit"
